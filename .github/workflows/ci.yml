name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          VITE_SITE_URL: https://example.com
      # --omit=dev: picomatch (pulled in only by vite/vitest/tailwindcss, all devDependencies)
      # currently has an unpatched high-severity advisory with no fixed release on npm yet.
      # It's build tooling only — never part of the bundle served to a visitor's browser — so
      # auditing just the production dependencies (react/react-dom/react-router-dom) matches
      # actual shipped risk instead of blocking every deploy on something with no fix to apply.
      # Revisit this once picomatch publishes a patched version.
      - run: npm audit --omit=dev --audit-level=high